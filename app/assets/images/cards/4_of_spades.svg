<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350" class="op-face">
  <defs>
    <style>
      .op-face .op-bg {
        fill: var(--op-color-neutral-minus-eight, #1c1a17);
      }

      /* opposite of the app's neutral background: light mode default is dark,
         dark mode flips it light */
      @media (prefers-color-scheme: dark) {
        .op-face .op-bg {
          fill: var(--op-color-neutral-plus-eight, #f5f4f2);
        }
      }

      .op-face .op-border {
        fill: none;
        stroke: var(--op-color-primary-base, #8d733f);
        stroke-width: 5;
      }

      .op-face .op-border-inner {
        fill: none;
        stroke: var(--op-color-primary-base, #8d733f);
        stroke-width: 2;
        opacity: 0.6;
      }

      /* spades/clubs are neutral ink, not the red alert token: light ink
         on the default (dark) card, dark ink once the card flips light */
      .op-face .op-spade {
        fill: var(--op-color-neutral-plus-eight, #f5f4f2);
      }

      .op-face .op-spade-line {
        fill: none;
        stroke: var(--op-color-neutral-plus-eight, #f5f4f2);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @media (prefers-color-scheme: dark) {
        .op-face .op-spade {
          fill: var(--op-color-neutral-minus-eight, #1c1a17);
        }

        .op-face .op-spade-line {
          stroke: var(--op-color-neutral-minus-eight, #1c1a17);
        }
      }

      .op-face .op-index {
        fill: var(--op-color-neutral-plus-eight, #f5f4f2);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 36px;
        text-anchor: middle;
      }

      @media (prefers-color-scheme: dark) {
        .op-face .op-index {
          fill: var(--op-color-neutral-minus-eight, #1c1a17);
        }
      }
    </style>
  </defs>

  <g class="op-card">
    <!-- card base with one thick border -->
    <rect class="op-bg" x="3" y="3" width="244" height="344" rx="16"/>
    <rect class="op-border" x="3" y="3" width="244" height="344" rx="16"/>

    <!-- single inner frame -->
    <rect class="op-border-inner" x="24" y="24" width="202" height="302" rx="8"/>

    <!-- corner index, top-left -->
    <g transform="translate(48 62)">
      <text class="op-index" x="0" y="0">4</text>
      <g transform="translate(0 22.4) scale(0.2)">
        <path class="op-spade" d="M 0 33 C -14 72 -68 72 -68 20 C -68 -20 -35 -46 0 -72 C 35 -46 68 -20 68 20 C 68 72 14 72 0 33 Z"/>
        <path class="op-spade" d="M -11 33 Q -15 60 -22 85 L 22 85 Q 15 60 11 33 Z"/>
      </g>
    </g>

    <!-- corner index, bottom-right -->
    <g transform="translate(202 288) rotate(180)">
      <text class="op-index" x="0" y="0">4</text>
      <g transform="translate(0 22.4) scale(0.2)">
        <path class="op-spade" d="M 0 33 C -14 72 -68 72 -68 20 C -68 -20 -35 -46 0 -72 C 35 -46 68 -20 68 20 C 68 72 14 72 0 33 Z"/>
        <path class="op-spade" d="M -11 33 Q -15 60 -22 85 L 22 85 Q 15 60 11 33 Z"/>
      </g>
    </g>

    <!-- center content: same large hollow spade icon for every rank -->
    <g transform="translate(125 175)">
      <path class="op-spade-line" d="M 0 33 C -14 72 -68 72 -68 20 C -68 -20 -35 -46 0 -72 C 35 -46 68 -20 68 20 C 68 72 14 72 0 33 Z"/>
      <path class="op-spade-line" opacity="0.7" d="M 2 31 C -15 74 -70 68 -69 18 C -70 -22 -33 -48 1 -74 C 33 -48 70 -22 70 18 C 69 74 15 70 2 31 Z"/>
      <path class="op-spade-line" d="M -11 33 Q -15 60 -22 85 L 22 85 Q 15 60 11 33 Z"/>
      <path class="op-spade-line" opacity="0.7" d="M -10 32 Q -17 58 -23 86 L 21 84 Q 14 61 12 34 Z"/>
    </g>
  </g>
</svg>
