<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350" class="op-face">
  <defs>
    <style>
      .op-face .op-bg {
        fill: var(--op-color-neutral-minus-eight, #1c1a17);
      }

      /* opposite of the app's neutral background: light mode default is dark,
         dark mode flips it light */
      @media (prefers-color-scheme: dark) {
        .op-face .op-bg {
          fill: var(--op-color-neutral-plus-eight, #f5f4f2);
        }
      }

      .op-face .op-border {
        fill: none;
        stroke: var(--op-color-primary-base, #8d733f);
        stroke-width: 5;
      }

      .op-face .op-border-inner {
        fill: none;
        stroke: var(--op-color-primary-base, #8d733f);
        stroke-width: 2;
        opacity: 0.6;
      }

      .op-face .op-emblem-line {
        fill: none;
        stroke: var(--op-color-alerts-danger-base, #b3123b);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .op-face .op-emblem-fill {
        fill: var(--op-color-alerts-danger-base, #b3123b);
      }

      .op-face .op-index {
        fill: var(--op-color-alerts-danger-base, #b3123b);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 36px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <g class="op-card">
    <!-- card base with one thick border -->
    <rect class="op-bg" x="3" y="3" width="244" height="344" rx="16"/>
    <rect class="op-border" x="3" y="3" width="244" height="344" rx="16"/>

    <!-- single inner frame -->
    <rect class="op-border-inner" x="24" y="24" width="202" height="302" rx="8"/>

    <!-- corner index, top-left -->
    <g transform="translate(48 62)">
      <text class="op-index" x="0" y="0">4</text>
      <path class="op-emblem-fill" d="M 0 14 C -3 8 -13 8 -13 16 C -13 24 -6 30 0 40 C 6 30 13 24 13 16 C 13 8 3 8 0 14 Z"/>
    </g>

    <!-- corner index, bottom-right -->
    <g transform="translate(202 288) rotate(180)">
      <text class="op-index" x="0" y="0">4</text>
      <path class="op-emblem-fill" d="M 0 14 C -3 8 -13 8 -13 16 C -13 24 -6 30 0 40 C 6 30 13 24 13 16 C 13 8 3 8 0 14 Z"/>
    </g>

    <!-- center content: same large heart icon for every rank -->
    <g transform="translate(125 175)">
      <path class="op-emblem-line" d="M 0 -25 C -14 -55 -70 -55 -70 -15 C -70 15 -35 35 0 55 C 35 35 70 15 70 -15 C 70 -55 14 -55 0 -25 Z"/>
      <path class="op-emblem-line" opacity="0.7" d="M 2 -23 C -12 -53 -68 -57 -69 -17 C -70 13 -33 37 -1 57 C 33 37 68 13 68 -17 C 67 -57 12 -53 2 -23 Z"/>
    </g>
  </g>
</svg>
