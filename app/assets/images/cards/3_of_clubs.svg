<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350" class="op-face">
  <defs>
    <style>
      .op-face .op-bg {
        fill: var(--op-color-neutral-minus-eight, #1c1a17);
      }

      /* opposite of the app's neutral background: light mode default is dark,
         dark mode flips it light */
      @media (prefers-color-scheme: dark) {
        .op-face .op-bg {
          fill: var(--op-color-neutral-plus-eight, #f5f4f2);
        }
      }

      .op-face .op-border {
        fill: none;
        stroke: var(--op-color-primary-base, #8d733f);
        stroke-width: 5;
      }

      .op-face .op-border-inner {
        fill: none;
        stroke: var(--op-color-primary-base, #8d733f);
        stroke-width: 2;
        opacity: 0.6;
      }

      /* clubs/spades are neutral ink, not the red alert token: light ink
         on the default (dark) card, dark ink once the card flips light */
      .op-face .op-club {
        fill: var(--op-color-neutral-plus-eight, #f5f4f2);
      }

      .op-face .op-club-line {
        fill: none;
        stroke: var(--op-color-neutral-plus-eight, #f5f4f2);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @media (prefers-color-scheme: dark) {
        .op-face .op-club {
          fill: var(--op-color-neutral-minus-eight, #1c1a17);
        }

        .op-face .op-club-line {
          stroke: var(--op-color-neutral-minus-eight, #1c1a17);
        }
      }

      .op-face .op-index {
        fill: var(--op-color-neutral-plus-eight, #f5f4f2);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 36px;
        text-anchor: middle;
      }

      @media (prefers-color-scheme: dark) {
        .op-face .op-index {
          fill: var(--op-color-neutral-minus-eight, #1c1a17);
        }
      }
    </style>
  </defs>

  <g class="op-card">
    <!-- card base with one thick border -->
    <rect class="op-bg" x="3" y="3" width="244" height="344" rx="16"/>
    <rect class="op-border" x="3" y="3" width="244" height="344" rx="16"/>

    <!-- single inner frame -->
    <rect class="op-border-inner" x="24" y="24" width="202" height="302" rx="8"/>

    <!-- corner index, top-left -->
    <g transform="translate(48 62)">
      <text class="op-index" x="0" y="0">3</text>
      <g transform="translate(0 22.4) scale(0.19)">
        <path class="op-club" d="M 0 -76 Q 36 -76 36 -40 Q 36 -4 0 -4 Q -36 -4 -36 -40 Q -36 -76 0 -76 Z"/>
        <path class="op-club" d="M -32 -20 Q 2 -20 2 14 Q 2 48 -32 48 Q -66 48 -66 14 Q -66 -20 -32 -20 Z"/>
        <path class="op-club" d="M 32 -20 Q 66 -20 66 14 Q 66 48 32 48 Q -2 48 -2 14 Q -2 -20 32 -20 Z"/>
        <path class="op-club" d="M -7 22 Q -14 55 -17 95 L 17 95 Q 14 55 7 22 Z"/>
      </g>
    </g>

    <!-- corner index, bottom-right -->
    <g transform="translate(202 288) rotate(180)">
      <text class="op-index" x="0" y="0">3</text>
      <g transform="translate(0 22.4) scale(0.19)">
        <path class="op-club" d="M 0 -76 Q 36 -76 36 -40 Q 36 -4 0 -4 Q -36 -4 -36 -40 Q -36 -76 0 -76 Z"/>
        <path class="op-club" d="M -32 -20 Q 2 -20 2 14 Q 2 48 -32 48 Q -66 48 -66 14 Q -66 -20 -32 -20 Z"/>
        <path class="op-club" d="M 32 -20 Q 66 -20 66 14 Q 66 48 32 48 Q -2 48 -2 14 Q -2 -20 32 -20 Z"/>
        <path class="op-club" d="M -7 22 Q -14 55 -17 95 L 17 95 Q 14 55 7 22 Z"/>
      </g>
    </g>

    <!-- center content: same large hollow club icon for every rank -->
    <g transform="translate(125 175)">
      <path class="op-club-line" d="M -3 -78 C 22 -83 40 -68 39 -42 C 39 -18 30 -3 2 -5 C -24 -6 -39 -20 -37 -46 C -36 -68 -20 -75 -3 -78 Z"/>
      <path class="op-club-line" d="M -30 -22 C -4 -24 3 -8 2 16 C 1 42 -8 50 -34 49 C -62 48 -70 34 -68 12 C -67 -10 -54 -21 -30 -22 Z"/>
      <path class="op-club-line" d="M 33 -21 C 6 -24 -2 -7 -1 17 C 0 43 10 51 36 49 C 63 47 70 32 69 11 C 68 -11 56 -20 33 -21 Z"/>
      <path class="op-club-line" d="M -8 21 Q -13 55 -18 95 L 16 94 Q 12 56 6 22 Q -1 19 -8 21 Z"/>
    </g>
  </g>
</svg>
