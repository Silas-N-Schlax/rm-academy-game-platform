<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350" class="op-back">
  <defs>
    <style>
      .op-back .op-bg {
        fill: var(--op-color-neutral-minus-eight, #1c1a17);
      }

      /* opposite of the app's neutral background: light mode default is dark,
         dark mode flips it light, matching the face cards */
      @media (prefers-color-scheme: dark) {
        .op-back .op-bg {
          fill: var(--op-color-neutral-plus-eight, #f5f4f2);
        }
      }

      .op-back .op-border {
        fill: none;
        stroke: var(--op-color-primary-base, #8d733f);
        stroke-width: 5;
      }

      .op-back .op-border-inner {
        fill: none;
        stroke: var(--op-color-primary-base, #8d733f);
        stroke-width: 2;
        opacity: 0.6;
      }

      .op-back .op-lattice {
        stroke: var(--op-color-primary-base, #8d733f);
        stroke-width: 1;
        opacity: 0.2;
      }

      .op-back .op-emblem-line {
        fill: none;
        stroke: var(--op-color-primary-base, #8d733f);
        stroke-width: 2;
      }

      .op-back .op-emblem-fill {
        fill: var(--op-color-primary-base, #8d733f);
      }
    </style>

    <!-- crossing diagonal lines: a woven trellis, not tiled squares -->
    <pattern id="op-back-lattice" width="24" height="24" patternUnits="userSpaceOnUse">
      <line class="op-lattice" x1="0" y1="0" x2="24" y2="24"/>
      <line class="op-lattice" x1="24" y1="0" x2="0" y2="24"/>
    </pattern>

    <clipPath id="op-back-clip">
      <rect x="24" y="24" width="202" height="302" rx="8"/>
    </clipPath>
  </defs>

  <g class="op-card">
    <!-- card base with one thick border -->
    <rect class="op-bg" x="3" y="3" width="244" height="344" rx="16"/>
    <rect class="op-border" x="3" y="3" width="244" height="344" rx="16"/>

    <!-- single inner frame -->
    <rect class="op-border-inner" x="24" y="24" width="202" height="302" rx="8"/>

    <!-- woven lattice texture -->
    <rect x="24" y="24" width="202" height="302" fill="url(#op-back-lattice)" clip-path="url(#op-back-clip)"/>

    <!-- central emblem: an eight-point compass star -->
    <g transform="translate(125 175)">
      <circle class="op-emblem-line" r="70"/>

      <!-- long cardinal points -->
      <path class="op-emblem-fill" d="M 0 -70 L 8 -20 L 0 -10 L -8 -20 Z"/>
      <path class="op-emblem-fill" d="M 0 70 L 8 20 L 0 10 L -8 20 Z"/>
      <path class="op-emblem-fill" d="M -70 0 L -20 8 L -10 0 L -20 -8 Z"/>
      <path class="op-emblem-fill" d="M 70 0 L 20 8 L 10 0 L 20 -8 Z"/>

      <!-- shorter diagonal points -->
      <path class="op-emblem-line" d="M -49 -49 L -18 -22"/>
      <path class="op-emblem-line" d="M 49 -49 L 18 -22"/>
      <path class="op-emblem-line" d="M -49 49 L -18 22"/>
      <path class="op-emblem-line" d="M 49 49 L 18 22"/>

      <circle class="op-emblem-line" r="22"/>
      <circle class="op-emblem-fill" r="4"/>
    </g>
  </g>
</svg>
