<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350">
  <defs>
    <style>
      :root {
        --op-color-primary-h: 40;
        --op-color-primary-s: 38%;
        --op-color-primary-l: 40%;
        --op-color-neutral-h: 40;
        --op-color-neutral-s: 4%;
      }

      .op-card {
        --bg-l: 11%;
        --line-l: 62%;
        --line-l-soft: 62%;
        --line-l-faint: 62%;
      }

      @media (prefers-color-scheme: dark) {
        .op-card {
          --bg-l: 97%;
          --line-l: var(--op-color-primary-l);
          --line-l-soft: 40%;
          --line-l-faint: 40%;
        }
      }

      .op-bg {
        fill: hsl(var(--op-color-neutral-h) var(--op-color-neutral-s) var(--bg-l));
      }

      .op-border {
        fill: none;
        stroke: hsl(var(--op-color-primary-h) var(--op-color-primary-s) var(--line-l));
        stroke-width: 2;
      }

      .op-border-soft {
        fill: none;
        stroke: hsl(var(--op-color-primary-h) var(--op-color-primary-s) var(--line-l-soft));
        stroke-width: 1;
        opacity: 0.55;
      }

      .op-lattice {
        fill: none;
        stroke: hsl(var(--op-color-primary-h) var(--op-color-primary-s) var(--line-l-faint));
        stroke-width: 0.75;
        opacity: 0.16;
      }

      .op-emblem-line {
        fill: none;
        stroke: hsl(var(--op-color-primary-h) var(--op-color-primary-s) var(--line-l));
        stroke-width: 1.25;
      }

      .op-emblem-fill {
        fill: hsl(var(--op-color-primary-h) var(--op-color-primary-s) var(--line-l));
      }

      .op-corner {
        fill: none;
        stroke: hsl(var(--op-color-primary-h) var(--op-color-primary-s) var(--line-l));
        stroke-width: 1;
        opacity: 0.85;
      }
    </style>

    <!-- diamond lattice tile -->
    <pattern id="op-diamond-lattice" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="none"/>
      <path class="op-lattice" d="M 11 0 L 22 11 L 11 22 L 0 11 Z"/>
    </pattern>

    <clipPath id="op-inner-clip">
      <rect x="20" y="20" width="210" height="310" rx="8"/>
    </clipPath>
  </defs>

  <g class="op-card">
    <!-- card base -->
    <rect class="op-bg" x="2" y="2" width="246" height="346" rx="16"/>
    <rect class="op-border" x="2" y="2" width="246" height="346" rx="16"/>

    <!-- inner frame -->
    <rect class="op-border-soft" x="14" y="14" width="222" height="322" rx="11"/>
    <rect class="op-border-soft" x="20" y="20" width="210" height="310" rx="8"/>

    <!-- lattice fill -->
    <rect x="20" y="20" width="210" height="310" fill="url(#op-diamond-lattice)" clip-path="url(#op-inner-clip)"/>

    <!-- central medallion -->
    <g transform="translate(125 175)">
      <circle class="op-emblem-line" r="34" fill="none"/>
      <circle class="op-emblem-line" r="27" fill="none" opacity="0.5"/>

      <!-- inner diamond -->
      <path class="op-emblem-line" d="M 0 -20 L 20 0 L 0 20 L -20 0 Z"/>
      <path class="op-emblem-fill" d="M 0 -6 L 6 0 L 0 6 L -6 0 Z"/>

      <!-- four short radiating ticks -->
      <line class="op-emblem-line" x1="0" y1="-34" x2="0" y2="-40"/>
      <line class="op-emblem-line" x1="0" y1="34" x2="0" y2="40"/>
      <line class="op-emblem-line" x1="-34" y1="0" x2="-40" y2="0"/>
      <line class="op-emblem-line" x1="34" y1="0" x2="40" y2="0"/>
    </g>

    <!-- corner flourishes, four rotations -->
    <g transform="translate(30 30)">
      <path class="op-corner" d="M 0 14 Q 0 0 14 0"/>
      <path class="op-corner" d="M 4 14 Q 4 4 14 4"/>
    </g>
    <g transform="translate(220 30) scale(-1 1)">
      <path class="op-corner" d="M 0 14 Q 0 0 14 0"/>
      <path class="op-corner" d="M 4 14 Q 4 4 14 4"/>
    </g>
    <g transform="translate(30 320) scale(1 -1)">
      <path class="op-corner" d="M 0 14 Q 0 0 14 0"/>
      <path class="op-corner" d="M 4 14 Q 4 4 14 4"/>
    </g>
    <g transform="translate(220 320) scale(-1 -1)">
      <path class="op-corner" d="M 0 14 Q 0 0 14 0"/>
      <path class="op-corner" d="M 4 14 Q 4 4 14 4"/>
    </g>
  </g>
</svg>
