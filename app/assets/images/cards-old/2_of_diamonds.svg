<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350" class="op-koh">
  <defs>
    <style>
      .op-koh {
        --op-color-primary-h: 40;
        --op-color-primary-s: 38%;
        --op-color-primary-l: 40%;
        --op-color-neutral-h: 40;
        --op-color-neutral-s: 4%;

        --bg-l: 11%;
        --line-l: 62%;
        --line-l-soft: 62%;
        --line-l-faint: 62%;

        --red-l: 55%;
        --black-l: 92%;
      }

      @media (prefers-color-scheme: dark) {
        .op-koh {
          --bg-l: 97%;
          --line-l: var(--op-color-primary-l);
          --line-l-soft: 40%;
          --line-l-faint: 40%;
          --red-l: 42%;
          --black-l: 10%;
        }
      }

      .op-koh .op-bg {
        fill: hsl(var(--op-color-neutral-h) var(--op-color-neutral-s) var(--bg-l));
      }

      .op-koh .op-border {
        fill: none;
        stroke: hsl(var(--op-color-primary-h) var(--op-color-primary-s) var(--line-l));
        stroke-width: 2;
      }

      .op-koh .op-border-soft {
        fill: none;
        stroke: hsl(var(--op-color-primary-h) var(--op-color-primary-s) var(--line-l-soft));
        stroke-width: 1;
        opacity: 0.55;
      }

      .op-koh .op-lattice {
        fill: none;
        stroke: hsl(var(--op-color-primary-h) var(--op-color-primary-s) var(--line-l-faint));
        stroke-width: 0.75;
        opacity: 0.08;
      }

      .op-koh .op-accent-line {
        fill: none;
        stroke: hsl(var(--op-color-primary-h) var(--op-color-primary-s) var(--line-l));
        stroke-width: 2;
        stroke-linejoin: round;
      }

      .op-koh .op-accent-fill {
        fill: hsl(var(--op-color-primary-h) var(--op-color-primary-s) var(--line-l));
      }

      .op-koh .op-suit-red-line { fill: none; stroke: hsl(0 65% var(--red-l)); stroke-width: 2; stroke-linejoin: round; }
      .op-koh .op-suit-red-fill { fill: hsl(0 65% var(--red-l)); }
      .op-koh .op-suit-black-line { fill: none; stroke: hsl(0 0% var(--black-l)); stroke-width: 2; stroke-linejoin: round; }
      .op-koh .op-suit-black-fill { fill: hsl(0 0% var(--black-l)); }

      .op-koh .op-index-text {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
      }
    </style>

    <pattern id="op-koh-lattice" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path class="op-lattice" d="M 11 0 L 22 11 L 11 22 L 0 11 Z"/>
    </pattern>

    <clipPath id="op-koh-inner-clip">
      <rect x="20" y="20" width="210" height="310" rx="8"/>
    </clipPath>

    <g id="op-koh-corner-index">
      <text class="op-index-text op-suit-red-fill" x="0" y="22" text-anchor="middle">K</text>
      <path class="op-suit-red-fill" transform="translate(0 38) scale(0.32)"
        d="M 0 25 C -25 5, -40 -20, -20 -30 C -5 -37, 0 -20, 0 -12 C 0 -20, 5 -37, 20 -30 C 40 -20, 25 5, 0 25 Z"/>
    </g>

    <g id="op-koh-crown">
      <path class="op-accent-line"
        d="M -25 10 L -25 -2 L -20 -18 L -10 -2 L 0 -26 L 10 -2 L 20 -18 L 25 -2 L 25 10 Z"/>
      <circle class="op-accent-fill" cx="-20" cy="-18" r="2.5"/>
      <circle class="op-accent-fill" cx="0" cy="-26" r="2.5"/>
      <circle class="op-accent-fill" cx="20" cy="-18" r="2.5"/>
    </g>
  </defs>

  <g class="op-card">
    <rect class="op-bg" x="2" y="2" width="246" height="346" rx="16"/>
    <rect class="op-border" x="2" y="2" width="246" height="346" rx="16"/>

    <rect class="op-border-soft" x="14" y="14" width="222" height="322" rx="11"/>
    <rect class="op-border-soft" x="20" y="20" width="210" height="310" rx="8"/>
    <rect x="20" y="20" width="210" height="310" fill="url(#op-koh-lattice)" clip-path="url(#op-koh-inner-clip)"/>

    <use href="#op-koh-corner-index" transform="translate(32 30)"/>
    <use href="#op-koh-corner-index" transform="translate(218 320) rotate(180)"/>

    <g transform="translate(125 175)">
      <path class="op-suit-red-line" transform="scale(1.7)"
        d="M 0 25 C -25 5, -40 -20, -20 -30 C -5 -37, 0 -20, 0 -12 C 0 -20, 5 -37, 20 -30 C 40 -20, 25 5, 0 25 Z"/>
      <use href="#op-koh-crown" transform="translate(0 -80)"/>
      <use href="#op-koh-crown" transform="translate(0 80) scale(1 -1)"/>
    </g>
  </g>
</svg>
